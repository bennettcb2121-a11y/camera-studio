name: tests

on:
  push:
    branches: [main, build/v1]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (same as run.sh)
        run: uv sync --frozen
      - name: Run tests
        # No .ARW on CI: raw-only tests skip; synthetic fixtures are generated by conftest.
        run: uv run pytest -q
      - name: Built UI is up to date
        if: runner.os == 'macOS'
        run: |
          cd frontend && npm ci && npm run build
          cd .. && git diff --stat --exit-code frontend/dist || (echo "frontend/dist is stale: run 'npm run build' and commit" && exit 1)
