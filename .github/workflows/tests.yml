name: tests

on:
  push:
    branches: [main, build/v1]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (same as run.sh)
        run: uv sync --frozen
      - name: Run tests
        shell: bash
        # No .ARW on CI: raw-only tests skip; synthetic fixtures are generated by conftest.
        run: uv run pytest -q -ra 2>&1 | tee pytest.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Post failure log on the PR
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### pytest failed on \`${{ matrix.os }}\` (run ${{ github.run_id }})"; echo; echo '```'; tail -n 150 pytest.log; echo '```'; } > comment.md
          gh pr comment "${{ github.head_ref || github.ref_name }}" --body-file comment.md || echo "no PR to comment on"
      - name: Built UI is up to date
        if: runner.os == 'macOS'
        run: |
          cd frontend && npm ci && npm run build
          cd .. && git diff --stat --exit-code frontend/dist || (echo "frontend/dist is stale: run 'npm run build' and commit" && exit 1)
