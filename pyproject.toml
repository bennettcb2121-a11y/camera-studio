[project]
name = "charlies-camera-studio"
version = "0.1.0"
description = "Personal photo + video editor for a Sony a6000"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "rawpy>=0.21",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "colour-science>=0.4.4",
    "imageio-ffmpeg>=0.5",
    "moviepy>=2.1",
    "scenedetect>=0.6.4",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "exifread>=3.0",
    "scipy>=1.13",
    "tifffile>=2024.5",
    "lensfunpy>=1.15",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
